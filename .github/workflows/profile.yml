name: profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Activity card
        run: python scripts/build_stats.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f2f2f2&color_dots=#1c1c1c,#3d3d3d,#6b6b6b,#a3a3a3,#f2f2f2
            dist/snake-light.svg?color_snake=#111111&color_dots=#ebebeb,#c4c4c4,#8f8f8f,#5e5e5e,#111111

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh activity card and snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
